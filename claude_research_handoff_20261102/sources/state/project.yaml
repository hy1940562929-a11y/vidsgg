state_policy:
  scope: schema_and_initial_state_only
  automation_enabled: false
  formal_state_owner: commander
  final_decision_authority: user
  ownership:
    commander: 负责正式状态推进和重大决策整合；重大事项须经用户确认。
    direction: 提出 Hypothesis Candidate，不直接将假设标记为 SUPPORTED。
    innovation: 提出 Method Candidate，不编造或写入虚假实验 Evidence。
    paper: 读取 claims 并提出 missing evidence，不自行提升 claim 状态。
    reviewer: 独立审查状态和证据，提出修正意见，不自行篡改事实。
    experiment: 仅通过用户人工带回的 Result Package 返回结果，不直接修改本地 state。
  append_only_files:
  - state/hypotheses.jsonl
  - state/evidence.jsonl
  - state/decisions.jsonl
  snapshot_files:
  - state/project.yaml
  - state/claims.yaml
  history_rules:
  - JSONL 每行必须是独立 JSON 对象，不写注释、示例或占位记录。
  - 不删除或覆盖历史记录；更正和状态改变通过追加新记录表达。
  - 新记录关联原对象及被修订记录，保留变更人、时间、原因和依据。
  - 同一假设追加完整状态版本，保持 hypothesis_id 和原始 created_at，更新 updated_at 并说明变更。
  - 当前快照由 Commander 根据可追溯记录整合；不能用快照覆盖来掩盖历史。
  evidence_rules:
  - 计划中的实验不是 Evidence；真实实验完成且结果实际导入之前，不创建实验 Evidence。
  - 文献报告与本项目实验结果明确区分，来源和材料必须可核查。
  - 结果导入不自动表示假设成立或通过审查；正式状态推进必须有相应依据。
  setup_rule: 本次初始化不授权 Agent 自动写入状态、创建任务、连接服务器或运行实验。
